services:
  - type: web
    name: linusfenixlistens-backend
    env: node
    buildCommand: |
    apt-get update && \
    apt-get install -y wget && \
    wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp && \
    chmod a+rx /usr/local/bin/yt-dlp && \
    npm install
    startCommand: node index.js
    plan: free
